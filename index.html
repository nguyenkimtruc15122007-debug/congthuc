<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo Định Lượng Pha Chế - Menu MOZO</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .select-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
            font-size: 15px;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f8fafc;
            outline: none;
            transition: border-color 0.3s;
            cursor: pointer;
        }
        select:focus { border-color: #3b82f6; }
        
        #size-container { display: none; }
        
        .quiz-section {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }
        .drink-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .drink-header h2 { margin: 0; color: #0f172a; font-size: 22px; }
        .drink-header p { margin: 5px 0 0 0; color: #64748b; font-weight: 600; }
        
        .ingredient-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
        }
        .ingredient-name {
            font-weight: 600;
            color: #334155;
            flex: 1;
            min-width: 120px;
        }
        
        .input-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        input[type="tel"].answer-input {
            width: 70px;
            padding: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }
        input[type="tel"].answer-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .unit-label {
            margin-left: 8px;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .correct {
            border-color: #10b981 !important;
            background-color: #d1fae5;
            color: #065f46;
        }
        .incorrect {
            border-color: #ef4444 !important;
            background-color: #fee2e2;
            color: #991b1b;
        }
        .feedback {
            font-size: 14px;
            width: 100%;
            margin-top: 8px;
            text-align: right;
            display: none;
        }
        .feedback.error-text { color: #dc2626; display: block; }
        .feedback.success-text { color: #059669; display: block; }

        /* Vùng chứa 2 nút bấm */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-confirm {
            flex: 2; /* Chiếm 2 phần */
            padding: 14px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .btn-confirm:hover { background: #2563eb; }
        .btn-confirm:active { transform: scale(0.98); }

        .btn-reset {
            flex: 1; /* Chiếm 1 phần */
            padding: 14px;
            background: #e2e8f0;
            color: #475569;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .btn-reset:hover { background: #cbd5e1; }
        .btn-reset:active { transform: scale(0.98); }

    </style>
</head>

</div>

        "FREEZE COFFEE": { "M": [{"name": "Sữa tươi", "amount": "25ml"}, {"name": "Sữa đặc", "amount": "30gr"}, {"name": "Rich", "amount": "25gr"}, {"name": "Bột frappe", "amount": "15gr"}, {"name": "Đường nước", "amount": "20ml"}, {"name": "Cà phê", "amount": "30ml"}, {"name": "Đá", "amount": "300GR"}], "L": [{"name": "Sữa tươi", "amount": "35ml"}, {"name": "Sữa đặc", "amount": "40gr"}, {"name": "Rich", "amount": "35gr"}, {"name": "Bột frappe", "amount": "20gr"}, {"name": "Đường nước", "amount": "30ml"}, {"name": "Cà phê", "amount": "45ml"}, {"name": "Đá", "amount": "500GR"}] },
        "CÁCH LÀM KEM BÔNG BÌNH 1 LÍT": { "Chuẩn": [{"name": "Base", "amount": "250GR"}, {"name": "Rich", "amount": "150GR"}, {"name": "Sữa tuoi", "amount": "50ML"}, {"name": "Gas", "amount": "1 VIÊN"}] }
    };

    const drinkSelect = document.getElementById("drink-select");
    const sizeContainer = document.getElementById("size-container");
    const sizeSelect = document.getElementById("size-select");
    const quizSection = document.getElementById("quiz-section");
    const quizForm = document.getElementById("quiz-form");
    const drinkTitle = document.getElementById("drink-title");
    const sizeTitle = document.getElementById("size-title");

    let currentIngredients = [];

    // Hàm tách số và đơn vị
    function parseAmount(amountStr) {
        const match = amountStr.match(/^([\d.,\/-]+)\s*(.*)$/);
        if (match) {
            return { value: match[1], unit: match[2] };
        }
        return { value: amountStr, unit: "" }; 
    }

    // Đổ danh sách món
    Object.keys(recipesData).forEach(drinkName => {
        const option = document.createElement("option");
        option.value = drinkName;
        option.textContent = drinkName;
        drinkSelect.appendChild(option);
    });

    // Lắng nghe chọn món
    drinkSelect.addEventListener("change", function() {
        const selectedDrink = this.value;
        if (!selectedDrink) {
            sizeContainer.style.display = "none";
            quizSection.style.display = "none";
            return;
        }
        const sizes = Object.keys(recipesData[selectedDrink]);
        sizeSelect.innerHTML = '<option value="">-- Chọn Size --</option>';

        if (sizes.length === 1 && sizes[0] === "Chuẩn") {
            sizeContainer.style.display = "none";
            renderQuiz(selectedDrink, "Chuẩn");
        } else {
            sizes.forEach(size => {
                const opt = document.createElement("option");
                opt.value = size;
                opt.textContent = `Size ${size}`;
                sizeSelect.appendChild(opt);
            });
            sizeContainer.style.display = "block";
            quizSection.style.display = "none"; 
        }
    });

    // Lắng nghe chọn size
    sizeSelect.addEventListener("change", function() {
        if (!this.value) { quizSection.style.display = "none"; return; }
        renderQuiz(drinkSelect.value, this.value);
    });

    // Tạo giao diện form
    function renderQuiz(drinkName, size) {
        drinkTitle.textContent = drinkName;
        sizeTitle.textContent = size === "Chuẩn" ? "(Định lượng tiêu chuẩn)" : `(Size ${size})`;
        currentIngredients = recipesData[drinkName][size];
        
        quizForm.innerHTML = "";
        
        currentIngredients.forEach((item, index) => {
            const parsed = parseAmount(item.amount);
            const row = document.createElement("div");
            row.className = "ingredient-row";
            
            row.innerHTML = `
                <div class="ingredient-name">${item.name}:</div>
                <div class="input-group">
                    <input type="tel" id="ing_${index}" class="answer-input" autocomplete="off">
                    <span class="unit-label">${parsed.unit}</span>
                </div>
                <span id="feedback_${index}" class="feedback"></span>
            `;
            quizForm.appendChild(row);
        });
        
        quizSection.style.display = "block";
    }

    // Chấm điểm
    function checkAnswers() {
        currentIngredients.forEach((item, index) => {
            const input = document.getElementById(`ing_${index}`);
            const feedback = document.getElementById(`feedback_${index}`);
            
            const parsed = parseAmount(item.amount);
            
            const userAnswer = input.value.replace(/\s+/g, '').toLowerCase();
            const correctAnswer = parsed.value.replace(/\s+/g, '').toLowerCase();

            input.classList.remove("correct", "incorrect");

            if (userAnswer === correctAnswer) {
                input.classList.add("correct");
                feedback.innerHTML = "✅ Đúng";
                feedback.className = "feedback success-text";
            } else {
                input.classList.add("incorrect");
                feedback.innerHTML = `❌ Đáp án đúng: <b>${parsed.value}</b>`;
                feedback.className = "feedback error-text";
            }
        });
    }

    // Hàm làm lại bài (Reset)
    function resetQuiz() {
        currentIngredients.forEach((item, index) => {
            const input = document.getElementById(`ing_${index}`);
            const feedback = document.getElementById(`feedback_${index}`);
            
            // Xóa nội dung người dùng nhập
            input.value = "";
            // Xóa màu xanh, đỏ
            input.classList.remove("correct", "incorrect");
            // Ẩn nội dung đáp án (reset lại class gốc ban đầu)
            feedback.className = "feedback";
        });
        
        // Tự động focus con trỏ vào ô đầu tiên để nhập lại luôn cho tiện
        const firstInput = document.getElementById('ing_0');
        if (firstInput) {
            firstInput.focus();
        }
    }
</script>
